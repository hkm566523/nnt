<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品详情 · 念宁堂</title>
<meta name="description" content="念宁堂产品明细：配方、适宜场景、食用方法与规格。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="wrap">
  <div class="crumb"><a href="index.html">首页</a> / <a href="index.html#products">产品系列</a> / <span id="crumbName">产品详情</span></div>
  <div class="detail" id="detail"></div>

  <section class="related">
    <div class="sec-head" style="text-align:left">
      <h2 class="sec-title serif" style="font-size:24px">相关推荐</h2>
    </div>
    <div class="prod-grid" id="relatedGrid" style="grid-template-columns:repeat(4,1fr)"></div>
  </section>
</div>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
NNT.renderHeader("products");
NNT.renderFooter();

const id = new URLSearchParams(location.search).get("id");
const p = getProduct(id) || PRODUCTS[0];
document.title = p.name + " · 念宁堂";
document.getElementById("crumbName").textContent = p.name;

document.getElementById("detail").innerHTML = `
  <div class="detail-visual">
    <div class="jar">
      <div class="jar-seal">${p.name.slice(0, 1)}</div>
      <div class="jar-name serif">${p.name}</div>
      <div class="jar-brand">NIANNINGTANG · ${p.catName}</div>
    </div>
  </div>
  <div>
    <span class="detail-tag">${p.catName}</span>
    <h1>${p.name}</h1>
    <p class="detail-eff">${p.eff}</p>
    <div class="detail-price">¥${p.price} <i>/ 件</i></div>
    <div class="d-row"><b>配方明细</b><span>${p.fml.join(" · ")}</span></div>
    <div class="d-row"><b>产品故事</b><span>${p.desc}</span></div>
    <div class="d-row"><b>适宜场景</b><span>${p.when}</span></div>
    <div class="d-row"><b>食用方法</b><span>${p.how}</span></div>
    <div class="d-row"><b>规格</b><span>${p.spec}</span></div>
    <div class="qty-row">
      <div class="qty">
        <button id="minus" aria-label="减少">−</button>
        <input id="qtyInput" value="1" inputmode="numeric" aria-label="数量">
        <button id="plus" aria-label="增加">＋</button>
      </div>
      <button class="btn btn-primary" id="addBtn">加入购物清单</button>
    </div>
    <p style="font-size:12px;color:var(--muted)">食养不能替代药物 · 孕妇及特殊体质请遵医嘱 · 支持 7 天无理由退换</p>
  </div>`;

/* 数量 */
const qtyInput = document.getElementById("qtyInput");
document.getElementById("minus").onclick = () => { qtyInput.value = Math.max(1, (+qtyInput.value || 1) - 1); };
document.getElementById("plus").onclick = () => { qtyInput.value = (+qtyInput.value || 1) + 1; };

/* 加入购物车 */
document.getElementById("addBtn").onclick = function () {
  const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);
  NNT.addToCart(p.id, qty);
  this.textContent = "已加入 ✓ 去结算";
  this.onclick = () => location.href = "cart.html";
};

/* 相关推荐：同系列优先 */
const related = PRODUCTS.filter(x => x.id !== p.id)
  .sort((a, b) => (b.cat === p.cat) - (a.cat === p.cat))
  .slice(0, 4);
document.getElementById("relatedGrid").innerHTML = related.map(NNT.cardHTML).join("");
</script>
</body>
</html>
